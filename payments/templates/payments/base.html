<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rim &amp; Rally payments</title>
<style>body{font:17px system-ui;line-height:1.6;background:#f7f6f0;color:#172c24;margin:0}main{max-width:760px;margin:32px auto;padding:24px;background:white;border-radius:12px}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:#07583e}input,select,textarea,button{font:inherit;max-width:100%;box-sizing:border-box}input,select,textarea{display:block;padding:8px;width:100%}input[type=checkbox]{width:auto;display:inline}button{padding:10px 18px;background:#164e3b;color:white;border:0;border-radius:5px;cursor:pointer}p{overflow-wrap:anywhere}.errorlist{color:#a11111}.qr{max-width:280px;width:100%;height:auto}small{display:block}li{margin-bottom:10px}nav form{margin:0}</style></head>
<body><main><nav><a href="/">Rim &amp; Rally</a><a href="{% url 'payments:book' %}">Book</a>{% if user.is_authenticated %}<a href="{% url 'payments:mine' %}">My bookings</a><form method="post" action="{% url 'payments:logout' %}">{% csrf_token %}<button>Sign out</button></form>{% else %}<a href="{% url 'payments:login' %}">Sign in</a><a href="{% url 'payments:signup' %}">Sign up</a>{% endif %}</nav>
{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
