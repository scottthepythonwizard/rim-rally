<button type="button" data-open-dialog="{{ id }}" class="{% if plain %}inline-flex min-h-11 items-center font-editorial text-xs underline-offset-4 hover:underline{% else %}{{ button }} border border-current hover:opacity-70 {{ button_extra }}{% endif %}">
  {{ label }}{% if arrow %}{% include 'rim_rally/arrow.html' %}{% endif %}
</button>
<dialog id="{{ id }}" aria-labelledby="{{ id }}-title" class="fixed inset-0 m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl bg-paper p-8 text-ink">
  <h2 id="{{ id }}-title" class="text-2xl font-bold">{{ title }}</h2>
  <p class="mt-4 text-sm leading-7">{{ message|default:"This feature is planned for a future release. Guest court booking is the focus of this frontend milestone." }}</p>
  <form method="dialog" class="mt-6"><button autofocus class="{{ button }} bg-ink text-white">Got it</button></form>
</dialog>
